
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fake Store Products</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>

    <!-- Heading -->
    <div class="container text-center my-4">
      <h1 class="fw-bold">Fake Store Products</h1>
      <p class="text-muted">Products fetched from Fake Store API</p>
    </div>

    <!-- Products -->
    <div class="container">
      <div class="row g-4" id="outputR">
      </div>
    </div>

    <script>
      fetch("https://fakestoreapi.com/products")
        .then((res) => {
          return res.json();
        })
        .then((result) => {

          let outputR = document.getElementById("outputR");

          result.map((eachProduct) => {

            outputR.innerHTML += `
              <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                <div class="card h-100 shadow-sm">

                  <img
                    src="${eachProduct?.image}"
                    class="card-img-top p-3"
                    alt="${eachProduct?.title}"
                    style="height: 250px; object-fit: contain;"
                  />

                  <div class="card-body d-flex flex-column">

                    <h5 class="card-title">
                      ${eachProduct?.title}
                    </h5>

                    <p class="card-text text-muted">
                      ${eachProduct?.description}
                    </p>

                    <h5 class="text-primary mt-auto">
                      $${eachProduct?.price}
                    </h5>

                    <a href="#" class="btn btn-primary mt-2">
                      View Product
                    </a>

                  </div>

                </div>

              </div>
            `;
          });

          console.log(result);
        })
        .catch((error) => {
          console.log(error);
        });
    </script>

  </body>
</html>
